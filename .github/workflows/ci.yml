name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    env:
      # Dummy values: CI never talks to Qloo, Nebius, TMDB or YouTube.
      DATABASE_URL: postgresql://tp:tp@localhost:5432/tonights_pick
      API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tp/api exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @tp/web build

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
